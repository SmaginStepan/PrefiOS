        # injected from the untracked Config/Secrets.xcconfig at build time
        PrefScoreApiKey: $(PREF_SCORE_API_KEY)
        PrefScoreSecret: $(PREF_SCORE_SECRET)
        GADApplicationIdentifier: $(PREF_ADMOB_APP_ID)
        PrefAdMobInterstitialId: $(PREF_ADMOB_INTERSTITIAL_ID)
        # public App Store id, for the "Rate us" review page
        PrefAppStoreId: "6787721817"
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: 6
        MARKETING_VERSION: "2.2.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: XHBZVNJQ2J
  PrefTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PrefTests
      - path: Config/Pref.storekit
        buildPhase: resources
    dependencies:
      - target: Pref
      - package: PrefEngine
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: XHBZVNJQ2J
schemes:
  Pref:
    build:
      targets:
        Pref: all
    run:
      config: Debug
      storeKitConfiguration: Config/Pref.storekit
    test:
      config: Debug
      targets: [PrefTests]
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
