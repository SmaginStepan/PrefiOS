name: Pref
options:
  bundleIdPrefix: com.an0obis
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  PrefEngine:
    path: PrefEngine
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 13.11.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: 3.1.0
targets:
  Pref:
    type: application
    platform: iOS
    sources:
      - path: Pref/Sources
      - path: Pref/Resources/Assets.xcassets
      - path: Pref/Resources/Localizable.xcstrings
      - path: Pref/Resources/PrivacyInfo.xcprivacy
      - path: Pref/Resources/en.lproj/InfoPlist.strings
      - path: Pref/Resources/ru.lproj/InfoPlist.strings
      - path: Pref/Resources/es.lproj/InfoPlist.strings
      - path: Pref/Resources/cards
        type: folder
        buildPhase: resources
      - path: Pref/Resources/tutorial.xml
        buildPhase: resources
      - path: Pref/Resources/tutorial_en.xml
        buildPhase: resources
      - path: Pref/Resources/tutorial_es.xml
        buildPhase: resources
      - path: Pref/Resources/dictionary.txt
        buildPhase: resources
    dependencies:
      - package: PrefEngine
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    info:
      path: Pref/Info.plist
      properties:
        CFBundleDisplayName: Preferans
        CFBundleShortVersionString: "2.2.0"
        CFBundleVersion: "6"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru, es]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        # shown by the ATT prompt (en here; ru/es in InfoPlist.strings)
        NSUserTrackingUsageDescription: "We use this to show more relevant ads. You can decline; the game works the same either way."
        # Google + select buyers, from developers.google.com/admob/ios/3p-skadnetworks
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 22mmun2rn5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: 2u9pt9hc89.skadnetwork
          - SKAdNetworkIdentifier: 3qcr597p9d.skadnetwork
          - SKAdNetworkIdentifier: 3qy4746246.skadnetwork
          - SKAdNetworkIdentifier: 3rd42ekr43.skadnetwork
          - SKAdNetworkIdentifier: 3sh42y64q3.skadnetwork
          - SKAdNetworkIdentifier: 4468km3ulz.skadnetwork
          - SKAdNetworkIdentifier: 44jx6755aq.skadnetwork
          - SKAdNetworkIdentifier: 47vhws6wlr.skadnetwork
          - SKAdNetworkIdentifier: 4dzt52r2t5.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 578prtvx9j.skadnetwork
          - SKAdNetworkIdentifier: 7ug5zh24hu.skadnetwork
          - SKAdNetworkIdentifier: 8c4e2ghe7u.skadnetwork
          - SKAdNetworkIdentifier: 8s468mfl3y.skadnetwork
          - SKAdNetworkIdentifier: 97r2b46745.skadnetwork
          - SKAdNetworkIdentifier: 9t245vhmpl.skadnetwork
          - SKAdNetworkIdentifier: a2p9lx4jpn.skadnetwork
          - SKAdNetworkIdentifier: c3frkrj4fj.skadnetwork
          - SKAdNetworkIdentifier: c6k4g5qg8m.skadnetwork
          - SKAdNetworkIdentifier: cp8zw746q7.skadnetwork
          - SKAdNetworkIdentifier: e5fvkxwrpn.skadnetwork
          - SKAdNetworkIdentifier: f38h382jlk.skadnetwork
          - SKAdNetworkIdentifier: gta9lk7p23.skadnetwork
          - SKAdNetworkIdentifier: hs6bdukanm.skadnetwork
          - SKAdNetworkIdentifier: k674qkevps.skadnetwork
