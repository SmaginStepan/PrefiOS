name: Pref
options:
  bundleIdPrefix: com.an0obis
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  PrefEngine:
    path: PrefEngine
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 13.11.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: 3.1.0
targets:
  Pref:
    type: application
    platform: iOS
    sources:
      - path: Pref/Sources
      - path: Pref/Resources/Assets.xcassets
      - path: Pref/Resources/Localizable.xcstrings
      - path: Pref/Resources/cards
        type: folder
        buildPhase: resources
      - path: Pref/Resources/tutorial.xml
        buildPhase: resources
      - path: Pref/Resources/tutorial_en.xml
        buildPhase: resources
      - path: Pref/Resources/tutorial_es.xml
        buildPhase: resources
      - path: Pref/Resources/dictionary.txt
        buildPhase: resources
    dependencies:
      - package: PrefEngine
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    info:
      path: Pref/Info.plist
      properties:
        CFBundleDisplayName: Preferans
        CFBundleShortVersionString: "2.2.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru, es]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        # injected from the untracked Config/Secrets.xcconfig at build time
        PrefScoreApiKey: $(PREF_SCORE_API_KEY)
        PrefScoreSecret: $(PREF_SCORE_SECRET)
        GADApplicationIdentifier: $(PREF_ADMOB_APP_ID)
        PrefAdMobInterstitialId: $(PREF_ADMOB_INTERSTITIAL_ID)
        # public App Store id, for the "Rate us" review page
        PrefAppStoreId: "6787721817"
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "2.2.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: XHBZVNJQ2J
  PrefTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PrefTests
      - path: Config/Pref.storekit
        buildPhase: resources
    dependencies:
      - target: Pref
      - package: PrefEngine
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: XHBZVNJQ2J
schemes:
  Pref:
    build:
      targets:
        Pref: all
    run:
      config: Debug
      storeKitConfiguration: Config/Pref.storekit
    test:
      config: Debug
      targets: [PrefTests]
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
